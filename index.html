<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎂 Happy Birthday Sristi! — Jatin 💖</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Dancing+Script:wght@400;600;700&family=Cormorant+Garamond:wght@300;400;500;600&family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <style>
        :root { --pink:#ff69b4;--pink-light:#ffb8d0;--gold:#ffd700;--bg:#0d0515;--glass:rgba(255,255,255,0.04);--glass-border:rgba(255,105,180,0.25); }
        * { margin:0;padding:0;box-sizing:border-box; }
        body { font-family:'Poppins',sans-serif;background:var(--bg);color:#fff;min-height:100vh;overflow-x:hidden; }
        #bgCanvas { position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none; }
        .overlay { position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at center,rgba(15,0,20,0.2) 0%,rgba(5,0,10,0.7) 100%);z-index:1;pointer-events:none; }
        .floating-hearts { position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:2; }
        .float-heart { position:absolute;font-size:1.5rem;animation:floatUp 8s linear infinite;opacity:0.6; }
        @keyframes floatUp { 0%{transform:translateY(110vh) rotate(0deg) scale(0);opacity:0;}10%{opacity:0.7;}90%{opacity:0.5;}100%{transform:translateY(-10vh) rotate(360deg) scale(1);opacity:0;} }
        .main { position:relative;z-index:10;max-width:800px;margin:0 auto;padding:20px; }
        
        .hero { min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center; }
        .hero-name { font-family:'Great Vibes',cursive;font-size:clamp(4rem,10vw,8rem);background:linear-gradient(45deg,#ff69b4,#ffd700,#ff69b4);background-size:300% 300%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 3s ease infinite; }
        @keyframes shimmer { 0%,100%{background-position:0% 50%;}50%{background-position:100% 50%;} }
        .hero-subtitle { font-family:'Dancing Script',cursive;font-size:1.8rem;color:var(--pink-light); }
        .hero-from { display:inline-flex;align-items:center;gap:6px;background:rgba(255,105,180,0.1);border:1px solid rgba(255,105,180,0.2);border-radius:30px;padding:6px 18px;font-size:0.85rem;color:var(--pink-light); }
        
        .section { padding:50px 20px;text-align:center; }
        .section-title { font-family:'Great Vibes',cursive;font-size:2.5rem;color:var(--pink);margin-bottom:15px; }
        
        /* LOVE CARD BUTTON */
        .love-card-section { padding:40px 20px 60px;text-align:center; }
        .btn { display:inline-block;padding:14px 38px;border:none;border-radius:50px;cursor:pointer;font-family:'Poppins',sans-serif;font-weight:600;font-size:0.95rem;letter-spacing:1px;transition:0.3s;margin:8px;text-decoration:none; }
        .btn-gold { background:linear-gradient(135deg,#ffd700,#ffa500);color:#1a0030;box-shadow:0 10px 30px rgba(255,215,0,0.4);font-size:1.1rem;padding:16px 48px; }
        .btn-gold:hover { transform:scale(1.05) translateY(-5px);box-shadow:0 20px 50px rgba(255,215,0,0.6); }
        
        /* ==================== LOVE CARD MODAL (FIXED) ==================== */
        .love-modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        .love-modal-overlay.active {
            display: flex !important;
        }
        
        .love-modal {
            width: 600px;
            max-width: 94vw;
            max-height: 85vh;
            background: #fffef8;
            border-radius: 12px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.6);
            position: relative;
            overflow-y: auto;
            animation: modalIn 0.4s ease;
        }
        @keyframes modalIn { from{opacity:0;transform:scale(0.85);} to{opacity:1;transform:scale(1);} }
        
        .love-modal .card-ribbon {
            width: 100%; height: 4px;
            background: linear-gradient(90deg, #ff69b4, #ffd700, #ff69b4);
            position: sticky; top: 0; z-index: 2;
        }
        .love-modal .card-close {
            position: absolute; top: 12px; right: 15px; z-index: 3;
            width: 35px; height: 35px; border-radius: 50%;
            background: #ff69b4; color: #fff; border: none;
            cursor: pointer; font-size: 1.2rem; display: flex;
            align-items: center; justify-content: center;
            transition: 0.3s;
        }
        .love-modal .card-close:hover { background: #e8559a; transform: scale(1.1); }
        
        .love-modal .card-inner { display: flex; padding: 25px; }
        .love-modal .card-photo-side { width: 44%; display: flex; flex-direction: column; align-items: center; padding-right: 18px; border-right: 1px solid #e8d0d8; }
        .love-modal .card-photo-frame { width: 155px; height: 195px; border: 5px solid #fff; border-radius: 6px; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,0.2); margin-bottom: 10px; }
        .love-modal .card-photo-frame img { width: 100%; height: 100%; object-fit: cover; }
        .love-modal .card-photo-nav { display: flex; align-items: center; gap: 10px; margin-top: 5px; }
        .love-modal .nav-arrow { width: 30px; height: 30px; border-radius: 50%; background: #ff69b4; color: #fff; border: none; cursor: pointer; font-size: 0.8rem; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .love-modal .nav-arrow:hover { background: #e8559a; }
        .love-modal .nav-dots { display: flex; gap: 4px; }
        .love-modal .nav-dot { width: 6px; height: 6px; border-radius: 50%; background: #d4a0b0; cursor: pointer; transition: 0.3s; }
        .love-modal .nav-dot.active { background: #ff69b4; width: 18px; border-radius: 10px; }
        .love-modal .card-photo-caption { font-family: 'Dancing Script', cursive; font-size: 0.8rem; color: #6b2040; margin-top: 4px; }
        
        .love-modal .card-msg-side { width: 56%; padding-left: 18px; text-align: center; overflow-y: auto; max-height: 280px; }
        .love-modal .card-msg-side h3 { font-family: 'Great Vibes', cursive; font-size: 1.5rem; color: #5a2035; margin-bottom: 4px; }
        .love-modal .msg-line { width: 40px; height: 2px; background: linear-gradient(90deg,transparent,#d4a0b0,transparent); margin: 6px auto; }
        .love-modal .msg-text { font-family: 'Dancing Script', cursive; font-size: 0.85rem; color: #4a1530; line-height: 1.7; white-space: pre-line; }
        .love-modal .msg-sign { font-family: 'Dancing Script', cursive; font-size: 1.1rem; color: #6b2040; margin-top: 8px; }
        
        @media (max-width:650px) {
            .love-modal .card-inner { flex-direction: column; }
            .love-modal .card-photo-side { width: 100%; border-right: none; border-bottom: 1px solid #e8d0d8; padding: 0 0 15px; margin-bottom: 12px; }
            .love-modal .card-msg-side { width: 100%; padding-left: 0; max-height: 220px; }
            .love-modal .card-photo-frame { width: 120px; height: 155px; }
        }
        
        /* Music */
        .music-btn { position:fixed;top:20px;right:20px;z-index:100;width:50px;height:50px;border-radius:50%;background:rgba(20,5,25,0.8);border:2px solid var(--pink);color:var(--pink);cursor:pointer;font-size:1.2rem;transition:0.3s;backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center; }
        .music-btn:hover { background:var(--pink);color:#fff; }
        .music-btn.playing { animation:pulse 2s infinite; }
        @keyframes pulse { 0%,100%{box-shadow:0 0 15px rgba(255,105,180,0.3);}50%{box-shadow:0 0 40px rgba(255,105,180,0.6);} }
        
        .scroll-down { text-align:center;margin-top:30px;color:rgba(255,255,255,0.4);font-size:0.8rem;letter-spacing:3px;animation:bounce 2s infinite; }
        @keyframes bounce { 0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);} }
    </style>
</head>
<body>
    <canvas id="bgCanvas"></canvas>
    <div class="overlay"></div>
    <div class="floating-hearts" id="floatingHearts"></div>
    <audio id="bgMusic" loop preload="auto"><source src="assets/music/ishq-wala-love.mp3" type="audio/mpeg"></audio>
    <button class="music-btn" id="musicToggle">🎵</button>

    <!-- ==================== LOVE CARD MODAL ==================== -->
    <div class="love-modal-overlay" id="loveModalOverlay">
        <div class="love-modal" id="loveModal">
            <div class="card-ribbon"></div>
            <button class="card-close" onclick="closeLoveCard()">✕</button>
            <div class="card-inner">
                <div class="card-photo-side">
                    <div class="card-photo-frame">
                        <img id="modalPhoto" src="" alt="Memory">
                    </div>
                    <div class="card-photo-nav">
                        <button class="nav-arrow" onclick="prevCardPhoto()">◀</button>
                        <div class="nav-dots" id="modalDots"></div>
                        <button class="nav-arrow" onclick="nextCardPhoto()">▶</button>
                    </div>
                    <p class="card-photo-caption" id="modalCaption"></p>
                </div>
                <div class="card-msg-side">
                    <h3 id="modalTitle"></h3>
                    <div class="msg-line"></div>
                    <p class="msg-text" id="modalMessage"></p>
                    <p class="msg-sign">— Forever Yours, Jatin 💝</p>
                </div>
            </div>
        </div>
    </div>

    <div class="main">
        <!-- HERO -->
        <div class="hero">
            <h1 class="hero-name">Sristi</h1>
            <p class="hero-subtitle">~ My Beautiful Girlfriend ~</p>
            <div class="hero-from"><span>💝</span> From Your Jatin <span>💝</span></div>
            <div class="scroll-down">↓ Scroll Down ↓</div>
        </div>

        <!-- LOVE CARD SECTION -->
        <div class="love-card-section">
            <h2 class="section-title" style="font-size:2.2rem;">💌 A Special Love Card 💌</h2>
            <p style="color:#ccc;margin-bottom:25px;font-size:1.1rem;">I made something special for you... 💕</p>
            <button class="btn btn-gold" onclick="openLoveCard()">
                💌 Open Your Love Card 💌
            </button>
        </div>
        
        <div style="text-align:center;padding:30px;color:#aaa;font-size:0.8rem;">
            Made with 💖 by <span style="color:var(--pink);">Jatin</span> for <span style="color:var(--pink);">Sristi</span> • 11 May 2025 🎂
        </div>
    </div>

    <script>
        // ==================== 3D BACKGROUND ====================
        const canvas=document.getElementById('bgCanvas'),renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
        renderer.setSize(window.innerWidth,window.innerHeight);renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
        const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,1000);camera.position.z=30;
        scene.add(new THREE.AmbientLight(0xffffff,0.5));const l1=new THREE.PointLight(0xff69b4,0.8,60);l1.position.set(8,8,20);scene.add(l1);
        function hs(){const s=new THREE.Shape();s.moveTo(0,0.5);s.bezierCurveTo(0,1.5,-2,1.5,-2,0.5);s.bezierCurveTo(-2,-1,0,-1.5,0,-2.5);s.bezierCurveTo(0,-1.5,2,-1,2,0.5);s.bezierCurveTo(2,1.5,0,1.5,0,0.5);return s;}
        for(let i=0;i<50;i++){const g=new THREE.ExtrudeGeometry(hs(),{depth:0.1,bevelEnabled:true,bevelThickness:0.05,bevelSize:0.05});const m=new THREE.MeshPhongMaterial({color:new THREE.Color().setHSL(0.9+Math.random()*0.1,0.8,0.6+Math.random()*0.4),emissive:new THREE.Color().setHSL(0.9,0.4,0.1),shininess:120,transparent:true,opacity:0.4+Math.random()*0.5});const h=new THREE.Mesh(g,m);h.position.set((Math.random()-0.5)*40,(Math.random()-0.5)*35,(Math.random()-0.5)*15);h.rotation.set(Math.random()*Math.PI*2,Math.random()*Math.PI*2,Math.random()*Math.PI*2);h.userData={rx:(Math.random()-0.5)*0.005,ry:(Math.random()-0.5)*0.005,rz:(Math.random()-0.5)*0.005,fs:0.001+Math.random()*0.003,fa:0.5+Math.random()*2,iy:h.position.y,ph:Math.random()*Math.PI*2};scene.add(h);}
        const sg=new THREE.BufferGeometry();const sc2=800;const sp=new Float32Array(sc2*3);const scl=new Float32Array(sc2*3);
        for(let i=0;i<sc2*3;i+=3){sp[i]=(Math.random()-0.5)*45;sp[i+1]=(Math.random()-0.5)*45;sp[i+2]=(Math.random()-0.5)*20;const c=Math.random();if(c<0.5){scl[i]=1;scl[i+1]=0.4;scl[i+2]=0.7;}else{scl[i]=1;scl[i+1]=1;scl[i+2]=1;}}
        sg.setAttribute('position',new THREE.BufferAttribute(sp,3));sg.setAttribute('color',new THREE.BufferAttribute(scl,3));
        const st=new THREE.Points(sg,new THREE.PointsMaterial({size:0.1,vertexColors:true,transparent:true,blending:THREE.AdditiveBlending}));scene.add(st);
        let mx=0,my=0;document.addEventListener('mousemove',(e)=>{mx=(e.clientX/window.innerWidth-0.5)*2;my=(e.clientY/window.innerHeight-0.5)*2;});
        function anim(){requestAnimationFrame(anim);const t=Date.now()*0.001;scene.children.forEach(o=>{if(o.userData&&o.userData.fs){o.rotation.x+=o.userData.rx||0;o.rotation.y+=o.userData.ry||0;o.rotation.z+=o.userData.rz||0;if(o.userData.iy!==undefined)o.position.y=o.userData.iy+Math.sin(t*o.userData.fs+o.userData.ph)*o.userData.fa;}});st.rotation.x+=0.00004;st.rotation.y+=0.00008;camera.position.x+=(mx*2-camera.position.x)*0.02;camera.position.y+=(-my*1.5-camera.position.y)*0.02;camera.lookAt(0,0,0);renderer.render(scene,camera);}anim();

        // Floating Hearts
        setInterval(()=>{const h=document.createElement('div');h.className='float-heart';h.textContent=['💖','💕','💝','💗'][Math.floor(Math.random()*4)];h.style.left=Math.random()*95+'%';h.style.fontSize=(Math.random()*22+14)+'px';h.style.animationDuration=(Math.random()*6+6)+'s';document.getElementById('floatingHearts').appendChild(h);setTimeout(()=>h.remove(),10000);},500);

        // ==================== LOVE CARD LOGIC ====================
        const cardData = [
            { photo: 'https://i.postimg.cc/CxCxfpvg/SRISTI.jpg', caption: 'My Favorite Photo 😍', title: 'You Are So Pretty! 💖', message: 'Sristi tumko pta hai ya mera fav photo hai!! I like this photo so much ❤️😍 you are so much pretty in this photo babe!! I fall in love after seeing you!! 😻💓\n\nI love you babe 💖' },
            { photo: 'https://i.postimg.cc/66G25gxj/Whats-App-Image-2026-05-09-at-2-35-37-AM.jpg', caption: 'My Promise 🤞', title: 'I Promise You! 💕', message: 'Sristi i know I am not perfect in my life and all mera life mai bh bhut dikkat hai and all but mai promise krtha hu mai tumara sath humasa dunga!!! I am become happy after talking with you!! I want humara bond aisa ban reh !! Iove you so much sristi 😭🎀' },
            { photo: 'https://i.postimg.cc/hPLXVmjC/Whats-App-Image-2026-05-09-at-2-35-38-AM.jpg', caption: 'Don\'t Overthink 😋', title: 'I\'m Here For You! 💖', message: 'Do not think to much bbg 😋 mai hu na sab kuch sahi hoga itna jada overthinking kon kya bol rah hai itna mt socho itna socho mt 😋❤️ sristi humm apka sath huu jada dimag kharab mt kro apna babe aisa hi tumhara birthday hai sad mt ho jada bbg' },
            { photo: 'https://i.postimg.cc/cLdrhJt4/Whats-App-Image-2026-05-09-at-2-35-38-AM-(1).jpg', caption: 'Forever Love 💓', title: 'Until The End of Time! 💫', message: 'I will love you as long as the sun burns in the sky as long as the moon shines its light into the dark night until the raging blue oceans become calm and run dry I will love you until the end of time😻💓' },
            { photo: 'https://i.postimg.cc/tgT70m5Q/Whats-App-Image-2026-05-09-at-2-35-39-AM.jpg', caption: 'My Peace 🦋', title: 'You Are My Sukoon! 🌸', message: 'Tum is chaotic duniya mein mera sukoon ho. Tumse mohabbat karna meri aadat nahi, balki meri rooh ka faisla hai. Jab bhi tumhari aankhon mein dekhta hoon, mujhe mera ghar aur meri khushi dikhai deti hai. 💖' },
            { photo: 'https://i.postimg.cc/4dHdy7qW/Whats-App-Image-2026-05-09-at-2-35-39-AM-(1).jpg', caption: 'My Special Person 💝', title: 'You Changed My Life! 😭', message: 'Tum meri life ki sabse pyaari aur special person ho. Jab se tum meri life mein aayi ho, sab kuch badal gaya hai. I am really lucky to have you in my life, love you so much😭💓' },
            { photo: 'https://i.postimg.cc/brQwHXzD/Whats-App-Image-2026-05-09-at-2-35-40-AM.jpg', caption: 'Can\'t Imagine Without You 😙', title: 'You Are My Everything! 🎀', message: 'Tumhare sath baat karke mera mood humesha sahi ho jata hai. Pata nahi maine kya achha kiya jo tum mujhe mili, par ab tumhare bina life imagine karna bhi impossible hai😙🎀' },
            { photo: 'https://i.postimg.cc/TPzxkkNw/Whats-App-Image-2026-05-09-at-2-39-57-AM.jpg', caption: 'Made With Love 💌', title: 'For My Special One! 💎', message: 'This card made by jatin for some one special Sristi kar!!!! I love you so much sristi and I want you as partners I really moree moree love you wifey!! 😙💓' }
        ];
        
        let currentCard = 0;
        
        function updateCardModal() {
            const d = cardData[currentCard];
            document.getElementById('modalPhoto').src = d.photo;
            document.getElementById('modalCaption').textContent = d.caption;
            document.getElementById('modalTitle').textContent = d.title;
            document.getElementById('modalMessage').textContent = d.message;
            
            const dots = document.getElementById('modalDots');
            dots.innerHTML = '';
            for (let i = 0; i < cardData.length; i++) {
                const dot = document.createElement('div');
                dot.className = 'nav-dot' + (i === currentCard ? ' active' : '');
                dot.onclick = () => { currentCard = i; updateCardModal(); };
                dots.appendChild(dot);
            }
        }
        
        function openLoveCard() {
            document.getElementById('loveModalOverlay').classList.add('active');
            currentCard = 0;
            updateCardModal();
        }
        
        function closeLoveCard() {
            document.getElementById('loveModalOverlay').classList.remove('active');
        }
        
        function nextCardPhoto() { currentCard = (currentCard + 1) % cardData.length; updateCardModal(); }
        function prevCardPhoto() { currentCard = (currentCard - 1 + cardData.length) % cardData.length; updateCardModal(); }
        
        // Close on overlay click
        document.getElementById('loveModalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeLoveCard();
        });
        
        // Keyboard
        document.addEventListener('keydown', function(e) {
            const overlay = document.getElementById('loveModalOverlay');
            if (overlay.classList.contains('active')) {
                if (e.key === 'Escape') closeLoveCard();
                if (e.key === 'ArrowRight') nextCardPhoto();
                if (e.key === 'ArrowLeft') prevCardPhoto();
            }
        });

        // Music
        const audio=document.getElementById('bgMusic'),mt=document.getElementById('musicToggle');
        function startM(){if(audio.paused){audio.play().then(()=>mt.classList.add('playing')).catch(()=>{});}}
        mt.addEventListener('click',()=>{if(audio.paused){audio.play();mt.classList.add('playing');}else{audio.pause();mt.classList.remove('playing');}});
        document.addEventListener('click',startM,{once:true});

        window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});
    </script>
</body>
</html>
